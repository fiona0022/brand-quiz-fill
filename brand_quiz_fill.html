<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌题库练习（填空版）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
    background: #0f0f1a; color: #e8e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 24px 16px;
  }
  .container { width: 100%; max-width: 680px; }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; font-size: 14px; color: #8888aa;
  }
  .progress-bar-wrap {
    width: 200px; height: 6px; background: #2a2a3a;
    border-radius: 3px; overflow: hidden; margin: 0 12px; flex: 1;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #6c63ff, #ff63c8);
    border-radius: 3px; transition: width 0.4s ease; width: 0%;
  }
  .correct-badge {
    background: #1a4a2e; color: #4cff91; border-radius: 4px;
    padding: 2px 8px; font-size: 13px; min-width: 60px; text-align: center;
  }
  .filter-bar {
    display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap;
    justify-content: center;
  }
  .type-filter-btn {
    padding: 6px 12px; border-radius: 6px;
    border: 1px solid #333355; background: #1a1a2e;
    color: #8888bb; cursor: pointer; font-size: 12px; transition: all 0.18s;
  }
  .type-filter-btn:hover:not(.active) {
    border-color: #555577; color: #aaaacc;
  }
  .type-filter-btn.active {
    font-weight: 600;
  }
  .mode-tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .mode-tab {
    padding: 8px 16px; border-radius: 8px; border: 1px solid #333355;
    background: #1a1a2e; color: #8888bb; cursor: pointer;
    font-size: 13px; transition: all 0.2s;
  }
  .mode-tab.active { background: #2a2a5e; color: #a0a0ff; border-color: #6c63ff; }
  .mode-tab:hover:not(.active) { border-color: #555577; color: #aaaacc; }
  .mode-tab.activeA { background: #2a2a5e; border-color: #4cff91; color: #4cff91; }
  .card {
    background: #1a1a2e; border-radius: 16px; border: 1px solid #2a2a45;
    padding: 28px 24px; margin-bottom: 20px; text-align: center;
    transition: border-color 0.3s;
  }
  .flash { animation: cardFlash 0.5s ease forwards; }
  @keyframes cardFlash {
    0%   { border-color: #00e676; box-shadow: 0 0 20px rgba(0,230,118,0.3); }
    60%  { border-color: #00e676; box-shadow: 0 0 30px rgba(0,230,118,0.2); }
    100% { border-color: #2a2a45; box-shadow: none; }
  }
  .skip-flash { animation: skipFlash 0.5s ease forwards; }
  @keyframes skipFlash {
    0%   { border-color: #8888bb; box-shadow: 0 0 10px rgba(136,136,187,0.2); }
    60%  { border-color: #666688; box-shadow: 0 0 15px rgba(136,136,187,0.15); }
    100% { border-color: #2a2a45; box-shadow: none; }
  }
  .question-label {
    font-size: 12px; color: #6c63ff; text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 16px;
  }
  .brand-name { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .brand-en { font-size: 16px; color: #8888bb; margin-bottom: 20px; min-height: 24px; }
  .answer-hint { font-size: 18px; color: #ccccff; margin-bottom: 20px; }
  .answer-input-wrap { position: relative; max-width: 360px; margin: 0 auto 16px; }
  .answer-input {
    width: 100%; padding: 12px 16px; border-radius: 10px;
    border: 1px solid #333355; background: #22223a;
    color: #d0d0ee; font-size: 15px; text-align: center;
    outline: none; transition: border-color 0.2s;
  }
  .answer-input:focus { border-color: #6c63ff; }
  .answer-input.correct { border-color: #00e676; background: #0d3a1f; color: #4cff91; }
  .answer-input.wrong { border-color: #ff5252; background: #3a0d0d; color: #ff8080; }
  .submit-btn {
    padding: 10px 32px; border-radius: 8px; border: 1px solid #6c63ff;
    background: #6c63ff; color: #fff; cursor: pointer;
    font-size: 14px; transition: background 0.2s;
  }
  .submit-btn:hover { background: #5a52e0; }
  .submit-btn:disabled { opacity: 0.5; cursor: default; }
  .feedback { margin-top: 14px; font-size: 14px; min-height: 20px; text-align: center; }
  .skip-btn {
    display: block; margin: 0 auto 24px; background: none;
    border: 1px solid #333355; color: #555577; padding: 8px 24px;
    border-radius: 8px; cursor: pointer; font-size: 13px; transition: all 0.2s;
  }
  .skip-btn:hover { border-color: #555577; color: #8888aa; }
  .result-card {
    background: #1a1a2e; border-radius: 16px; border: 1px solid #2a2a45;
    padding: 40px 24px; text-align: center; margin-bottom: 24px;
  }
  .result-icon { font-size: 64px; margin-bottom: 16px; }
  .result-title { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .result-sub { font-size: 15px; color: #8888bb; margin-bottom: 24px; }
  .result-stats { display: flex; gap: 16px; justify-content: center; margin-bottom: 28px; }
  .stat-box {
    background: #22223a; border-radius: 12px; padding: 16px 24px;
    text-align: center; min-width: 100px;
  }
  .stat-num { font-size: 28px; font-weight: 700; color: #a0a0ff; }
  .stat-label { font-size: 12px; color: #666688; margin-top: 4px; }
  .stat-box.green .stat-num { color: #4cff91; }
  .stat-box.red .stat-num { color: #ff6b6b; }
  .restart-btn {
    background: #6c63ff; color: #fff; border: none;
    padding: 14px 40px; border-radius: 10px; font-size: 16px;
    cursor: pointer; font-weight: 600; transition: background 0.2s;
  }
  .restart-btn:hover { background: #5a52e0; }
  .type-legend { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
  .type-pill {
    font-size: 11px; padding: 3px 10px; border-radius: 20px;
    background: #22223a; border: 1px solid #333355; color: #8888bb;
  }
  .summary-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
  .summary-item {
    background: #1a1a2e; border: 1px solid #2a2a45; border-radius: 10px;
    padding: 12px 8px; text-align: center;
  }
  .summary-n { font-size: 20px; font-weight: 700; color: #a0a0ff; }
  .summary-l { font-size: 10px; color: #555577; margin-top: 2px; }
  .summary-item.good .summary-n { color: #4cff91; }
  .summary-item.bad .summary-n { color: #ff6b6b; }
</style>
</head>
<body>
<div class="container" id="app"></div>

<script src="quiz_data.js"></script>
<script>
// ════════════════════════════════════════════════
// 常量
// ════════════════════════════════════════════════
const TYPE_MAP = { f: '时装与皮具', c: '化妆品与香水', w: '腕表与珠宝', o: '其他/零售', l: '酒类', g: '眼镜' };
const TYPE_COLORS = { f: '#ff6b9d', c: '#ff9d6b', w: '#6bccff', o: '#9dff6b', l: '#ffd96b', g: '#c084fc' };

// ════════════════════════════════════════════════
// 状态
// ════════════════════════════════════════════════
const WRONG_KEY = 'brand_quiz_fill_wrongs';

function loadWrongs() {
  try { return JSON.parse(localStorage.getItem(WRONG_KEY) || '[]'); } catch { return []; }
}
function saveWrongs(arr) {
  localStorage.setItem(WRONG_KEY, JSON.stringify(arr));
}

const S = {
  mode: 'group',
  typeFilter: null,
  phase: 'quiz',
  queue: [],
  totalCount: 0,
  doneCount: 0,
  correctCount: 0,
  wrongCount: 0,
  current: null,
  prev: null,           // 上一题快照 {brand, correct, userVal, isCorrect}
  waitTimer: null,
  autoJump: true,
  typeCorrect: { f:0, c:0, w:0, o:0, l:0, g:0 },
  typeTotal:   { f:0, c:0, w:0, o:0, l:0, g:0 },
  wrongByType:  {},
  wrongByGroup: {},
  wrongReviewMode: false,
  wrongQueue: [],
  wrongDoneCount: 0,
  wrongCorrectCount: 0,
};

// ════════════════════════════════════════════════
// 工具
// ════════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getCorrectAnswer(brand) {
  return S.mode === 'group' ? brand[2] : TYPE_MAP[brand[4]];
}

// 宽松匹配：用户输入 vs 正确答案
// 去掉"集团"，忽略大小写，去掉空格后比较
function isAnswerMatch(userVal, correct) {
  const norm = (s) => s.replace(/\s+/g, '').replace(/集团/g, '').toLowerCase();
  const u = norm(userVal);
  const c = norm(correct);
  return u === c || c.includes(u) || u.includes(c);
}

// ════════════════════════════════════════════════
// 错题管理
// ════════════════════════════════════════════════
function wrongAdd(entry) {
  const wrongs = loadWrongs();
  const key = entry.brand[0] + '|' + entry.mode;
  const exists = wrongs.findIndex(w => w.key === key);
  if (exists >= 0) {
    wrongs[exists] = { ...entry, key, ts: Date.now() };
  } else {
    wrongs.push({ ...entry, key, ts: Date.now() });
  }
  saveWrongs(wrongs);
}

function wrongRemove(key) {
  const wrongs = loadWrongs().filter(w => w.key !== key);
  saveWrongs(wrongs);
}

function wrongClear() {
  saveWrongs([]);
}

function getWrongCount() {
  return loadWrongs().length;
}

// 根据当前类型筛选器获取品牌池
function getFilteredBrands() {
  if (!S.typeFilter) return BRANDS;
  return BRANDS.filter(b => b[4] === S.typeFilter);
}

// ════════════════════════════════════════════════
// 出题
// ════════════════════════════════════════════════
function nextQuestion() {
  if (S.waitTimer) { clearTimeout(S.waitTimer); S.waitTimer = null; }

  if (S.wrongReviewMode) {
    if (S.wrongQueue.length === 0) {
      S.wrongReviewMode = false;
      S.phase = 'result';
      render();
      return;
    }
    const entry = S.wrongQueue.shift();
    S.current = entry.brand;
    S.mode = entry.mode;
    S.wrongDoneCount++;
    render();
    return;
  }

  if (S.queue.length === 0) {
    S.phase = 'result';
    render();
    return;
  }

  S.current = S.queue.shift();
  S.doneCount++;
  S.typeTotal[S.current[4]]++;
  S.phase = 'quiz';
  render();
  setTimeout(() => {
    const inp = document.getElementById('answerInput');
    if (inp) inp.focus();
  }, 50);
}

// ════════════════════════════════════════════════
// 答题（回车或点击提交）
// ════════════════════════════════════════════════
function handleSubmit() {
  if (S.waitTimer || S.phase !== 'quiz') return;
  const inp = document.getElementById('answerInput');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val) return;

  const correct = getCorrectAnswer(S.current);
  const brand = S.current;
  const card = document.getElementById('qcard');
  const feedback = document.getElementById('feedback');

  // 保存上一题
  S.prev = {
    brand,
    correct,
    userVal: val,
    isCorrect: isAnswerMatch(val, correct)
  };

  if (isAnswerMatch(val, correct)) {
    // 正确
    if (!S.wrongReviewMode) {
      S.correctCount++;
      S.typeCorrect[brand[4]]++;
    } else {
      S.wrongCorrectCount++;
      const key = brand[0] + '|' + S.mode;
      wrongRemove(key);
    }
    inp.classList.add('correct');
    inp.disabled = true;
    const btn = document.getElementById('submitBtn');
    if (btn) btn.disabled = true;
    if (feedback) {
      feedback.textContent = '✓ 正确';
      feedback.style.color = '#4cff91';
    }
    if (card) card.classList.add('flash');

    S.waitTimer = true;
    const onEnd = () => { S.waitTimer = false; nextQuestion(); };
    document.addEventListener('quiz-jump', onEnd, { once: true });
    setTimeout(() => document.dispatchEvent(new Event('quiz-jump')), 500);

  } else {
    // 错误
    if (!S.wrongReviewMode) {
      S.wrongCount++;
      if (S.mode === 'group') {
        S.wrongByGroup[brand[2]] = (S.wrongByGroup[brand[2]] || 0) + 1;
      } else {
        S.wrongByType[brand[4]] = (S.wrongByType[brand[4]] || 0) + 1;
      }
      wrongAdd({ brand, mode: S.mode, correct, userVal: val });
    }
    inp.classList.add('wrong');
    if (feedback) {
      feedback.textContent = `✗ 正确答案是：${correct}`;
      feedback.style.color = '#ff8080';
    }
    if (card) card.classList.add('skip-flash');

    if (S.autoJump) {
      S.waitTimer = true;
      const onEnd = () => { S.waitTimer = null; nextQuestion(); };
      document.addEventListener('quiz-jump', onEnd, { once: true });
      setTimeout(() => document.dispatchEvent(new Event('quiz-jump')), 1000);
    }
  }
}

function handleSkip() {
  if (S.waitTimer || S.phase !== 'quiz') return;
  const correct = getCorrectAnswer(S.current);
  const brand = S.current;

  S.prev = { brand, correct, userVal: null, isCorrect: false };

  if (!S.wrongReviewMode) {
    S.wrongCount++;
    if (S.mode === 'group') {
      S.wrongByGroup[brand[2]] = (S.wrongByGroup[brand[2]] || 0) + 1;
    } else {
      S.wrongByType[brand[4]] = (S.wrongByType[brand[4]] || 0) + 1;
    }
    wrongAdd({ brand, mode: S.mode, correct, userVal: null });
  }

  const feedback = document.getElementById('feedback');
  if (feedback) {
    feedback.textContent = `正确答案是：${correct}，即将跳到下一题`;
    feedback.style.color = '#8888bb';
  }
  const card = document.getElementById('qcard');
  if (card) card.classList.add('skip-flash');

  S.waitTimer = true;
  const onEnd = () => { S.waitTimer = false; nextQuestion(); };
  document.addEventListener('quiz-jump', onEnd, { once: true });
  setTimeout(() => document.dispatchEvent(new Event('quiz-jump')), 500);
}

// ════════════════════════════════════════════════
// 事件
// ════════════════════════════════════════════════
document.getElementById('app').addEventListener('click', function(e) {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;

  if (action === 'switchMode') {
    switchMode(target.dataset.mode);
  } else if (action === 'setFilter') {
    setFilter(target.dataset.filter === 'null' ? null : target.dataset.filter);
  } else if (action === 'submitAnswer') {
    handleSubmit();
  } else if (action === 'skip') {
    handleSkip();
  } else if (action === 'restart') {
    switchMode(S.mode);
  } else if (action === 'toggleAutoJump') {
    S.autoJump = !S.autoJump;
    render();
  } else if (action === 'prevQuestion') {
    prevQuestion();
  } else if (action === 'switchToWrongReview') {
    switchToWrongReview();
  } else if (action === 'exitWrongReview') {
    exitWrongReview();
  } else if (action === 'clearWrongReview') {
    clearWrongAnswers();
  }
});

document.getElementById('app').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && S.phase === 'quiz') {
    handleSubmit();
  }
});

// ════════════════════════════════════════════════
// 上一题 & 错题复习
// ════════════════════════════════════════════════
function prevQuestion() {
  if (!S.prev || S.doneCount <= 1) return;
  S.current = S.prev.brand;
  S.typeTotal[S.current[4]]--;
  if (S.prev.isCorrect) {
    S.correctCount--;
    S.typeCorrect[S.current[4]]--;
  } else {
    S.wrongCount--;
    if (S.mode === 'group') {
      S.wrongByGroup[S.current[2]] = Math.max(0, (S.wrongByGroup[S.current[2]] || 0) - 1);
    } else {
      S.wrongByType[S.current[4]] = Math.max(0, (S.wrongByType[S.current[4]] || 0) - 1);
    }
  }
  const saved = S.prev;
  S.prev = null;
  S.phase = 'quiz';
  render();
  // 恢复输入框状态
  if (saved.userVal) {
    const inp = document.getElementById('answerInput');
    if (inp) {
      inp.value = saved.userVal;
      if (!saved.isCorrect) inp.classList.add('wrong');
      else inp.classList.add('correct');
    }
  }
}

function switchToWrongReview() {
  const wrongs = loadWrongs();
  if (wrongs.length === 0) {
    alert('暂无错题，继续加油！');
    return;
  }
  if (S.waitTimer) { clearTimeout(S.waitTimer); S.waitTimer = null; }
  S.wrongReviewMode = true;
  S.wrongQueue = shuffle([...wrongs]);
  S.wrongDoneCount = 0;
  S.wrongCorrectCount = 0;
  if (S.wrongQueue.length > 0) {
    const first = S.wrongQueue[0];
    S.current = first.brand;
    S.mode = first.mode;
    S.phase = 'quiz';
  }
  render();
}

function exitWrongReview() {
  if (S.waitTimer) { clearTimeout(S.waitTimer); S.waitTimer = null; }
  S.wrongReviewMode = false;
  switchMode(S.mode);
}

function clearWrongAnswers() {
  if (!confirm('确定清空全部错题记录？')) return;
  wrongClear();
  render();
}

// ════════════════════════════════════════════════
// 切换模式 & 重启
// ════════════════════════════════════════════════
function switchMode(newMode) {
  if (S.waitTimer) { clearTimeout(S.waitTimer); S.waitTimer = null; }
  S.wrongReviewMode = false;
  S.mode = newMode;
  S.prev = null;
  const pool = getFilteredBrands();
  S.queue = shuffle([...pool]);
  S.totalCount = pool.length;
  S.doneCount = 0;
  S.correctCount = 0;
  S.wrongCount = 0;
  S.typeCorrect = { f:0, c:0, w:0, o:0, l:0, g:0 };
  S.typeTotal   = { f:0, c:0, w:0, o:0, l:0, g:0 };
  S.wrongByType = {};
  S.wrongByGroup = {};
  nextQuestion();
}

function setFilter(f) {
  if (S.waitTimer) { clearTimeout(S.waitTimer); S.waitTimer = null; }
  S.wrongReviewMode = false;
  S.typeFilter = f;
  S.prev = null;
  const pool = getFilteredBrands();
  S.queue = shuffle([...pool]);
  S.totalCount = pool.length;
  S.doneCount = 0;
  S.correctCount = 0;
  S.wrongCount = 0;
  S.typeCorrect = { f:0, c:0, w:0, o:0, l:0, g:0 };
  S.typeTotal   = { f:0, c:0, w:0, o:0, l:0, g:0 };
  S.wrongByType = {};
  S.wrongByGroup = {};
  nextQuestion();
}

// ════════════════════════════════════════════════
// 渲染
// ════════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  if (S.phase === 'result') {
    app.innerHTML = renderResult();
    return;
  }

  if (S.wrongReviewMode) {
    app.innerHTML = renderWrongReview();
    return;
  }

  const pct = S.totalCount > 0 ? Math.round((S.doneCount / S.totalCount) * 100) : 0;
  const qLabel = S.mode === 'group' ? '这个品牌属于哪个集团？' : '这个品牌属于哪个品类？';
  const [cn, enBrand, groupDisplay, groupInternal, typ] = S.current;
  const displayName = enBrand || cn;

  const typePillsHtml = Object.entries(TYPE_MAP).map(([k, v]) =>
    `<span class="type-pill" style="border-color:${TYPE_COLORS[k]};color:${TYPE_COLORS[k]}">${k}·${v}</span>`
  ).join('');

  const filterBtnHtml = Object.entries(TYPE_MAP).map(([k, v]) =>
    `<button class="type-filter-btn ${S.typeFilter===k?'active':''}"
      data-action="setFilter" data-filter="${k}"
      style="${S.typeFilter===k ? `background:${TYPE_COLORS[k]}20;border-color:${TYPE_COLORS[k]};color:${TYPE_COLORS[k]}` : ''}">
      ${k} ${v}
    </button>`
  ).join('');

  const allActive = S.typeFilter === null;
  const allBtnStyle = allActive
    ? 'background:#2a2a5e;border-color:#6c63ff;color:#a0a0ff'
    : '';

  const summaryHtml = Object.entries(TYPE_MAP).map(([k, v]) => {
    const tot = S.typeTotal[k], cor = S.typeCorrect[k];
    const cls = tot > 0 ? (cor / tot >= 0.7 ? 'good' : cor > 0 && tot > 0 ? 'bad' : '') : '';
    return `<div class="summary-item ${cls}">
      <div class="summary-n">${cor}<span style="font-size:13px;color:#555">/${tot}</span></div>
      <div class="summary-l">${k} ${v.slice(0,4)}</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="status-bar">
      <span>${S.doneCount} / ${S.totalCount}</span>
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
      <span class="correct-badge">✓ ${S.correctCount}</span>
      ${S.wrongCount > 0 ? `<span style="color:#ff8080;font-size:13px;margin-left:8px">✗ ${S.wrongCount}</span>` : ''}
    </div>

    <div class="type-legend">${typePillsHtml}</div>

    <div class="filter-bar">
      <button class="type-filter-btn all-filter ${allActive?'active':''}"
        data-action="setFilter" data-filter="null"
        style="${allBtnStyle}">全部</button>
      ${filterBtnHtml}
    </div>

    <div class="mode-tabs">
      <button class="mode-tab ${S.mode==='group'?'active':''}" data-action="switchMode" data-mode="group">考集团归属</button>
      <button class="mode-tab ${S.mode==='type'?'active':''}" data-action="switchMode" data-mode="type">考品类分类</button>
      <button class="mode-tab ${S.autoJump?'activeA':''}" data-action="toggleAutoJump"
        style="${S.autoJump?'background:#2a2a5e;border-color:#4cff91;color:#4cff91':'border-color:#333;color:#555'}">
        ${S.autoJump?'✓':'✗'} 自动跳下一题
      </button>
      <button class="mode-tab" data-action="switchToWrongReview"
        style="border-color:#ff6b6b;color:#ff9d6b;${getWrongCount()>0?'background:#2a1a1a':''}">
        错题复习 ${getWrongCount()>0?'('+getWrongCount()+')':''}
      </button>
    </div>

    <div class="card" id="qcard">
      <div class="question-label">${S.doneCount} / ${S.totalCount}</div>
      <div class="brand-name">${displayName}</div>
      <div class="answer-hint">${qLabel}</div>
      <div class="answer-input-wrap">
        <input type="text" id="answerInput" class="answer-input"
          placeholder="输入答案后按回车或点击提交" autocomplete="off" />
      </div>
      <button class="submit-btn" id="submitBtn" data-action="submitAnswer">提交答案</button>
      <div class="feedback" id="feedback"></div>
    </div>

    <button class="skip-btn" id="skipBtn" data-action="skip">跳过此题（显示答案）→</button>

    ${S.doneCount > 1 ? '<button class="skip-btn" style="margin-top:6px;color:#444466" data-action="prevQuestion">← 回到上一题</button>' : ''}

    <div class="summary-grid">${summaryHtml}</div>
  `;
}

function renderResult() {
  const rate = S.totalCount > 0 ? Math.round((S.correctCount / S.totalCount) * 100) : 0;
  const emoji = rate >= 90 ? '🏆' : rate >= 70 ? '👏' : rate >= 50 ? '💪' : '📚';
  const msg = rate >= 90 ? '太厉害了！全部掌握！'
            : rate >= 70 ? '很棒！继续加油！'
            : rate >= 50 ? '不错，再接再厉！' : '多练几遍就熟悉了！';

  const typeDetailHtml = Object.entries(TYPE_MAP).map(([k, v]) => {
    const tot = S.typeTotal[k], cor = S.typeCorrect[k];
    const pct = tot > 0 ? Math.round(cor / tot * 100) : 0;
    return `<span class="type-pill" style="border-color:${TYPE_COLORS[k]};color:${TYPE_COLORS[k]}">${k}·${v} ${cor}/${tot}(${pct}%)</span>`;
  }).join('');

  const weakTypeHtml = Object.keys(S.wrongByType).length > 0
    ? `<div class="card" style="text-align:left;margin-top:16px">
        <div style="font-size:13px;color:#888;margin-bottom:12px">品类薄弱点</div>
        ${Object.entries(S.wrongByType).sort((a,b)=>b[1]-a[1]).map(([k,cnt]) =>
          `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a2a45;font-size:14px">
            <span style="color:${TYPE_COLORS[k]}">${TYPE_MAP[k]||k} (${k})</span>
            <span style="color:#ff6b6b">错 ${cnt} 题</span>
          </div>`).join('')}
       </div>` : '';

  const weakGroupHtml = Object.keys(S.wrongByGroup).length > 0
    ? `<div class="card" style="text-align:left;margin-top:16px">
        <div style="font-size:13px;color:#888;margin-bottom:12px">集团薄弱点（错题最多的前10）</div>
        ${Object.entries(S.wrongByGroup).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([g,cnt]) =>
          `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2a2a45;font-size:14px">
            <span style="color:#aaa">${g}</span>
            <span style="color:#ff6b6b">错 ${cnt} 题</span>
          </div>`).join('')}
       </div>` : '';

  return `
    <div class="result-card">
      <div class="result-icon">${emoji}</div>
      <div class="result-title">${msg}</div>
      <div class="result-sub">正确率 ${rate}%</div>
      <div class="result-stats">
        <div class="stat-box green">
          <div class="stat-num">${S.correctCount}</div>
          <div class="stat-label">正确</div>
        </div>
        <div class="stat-box red">
          <div class="stat-num">${S.wrongCount}</div>
          <div class="stat-label">错误/跳过</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">${S.totalCount}</div>
          <div class="stat-label">总题数</div>
        </div>
      </div>
    </div>
    <div style="text-align:center;margin-bottom:8px"><span style="font-size:12px;color:#666">各品类正确率</span></div>
    <div class="type-legend" style="margin-bottom:20px">${typeDetailHtml}</div>
    ${weakTypeHtml}
    ${weakGroupHtml}
    <div style="text-align:center;margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <button class="restart-btn" data-action="restart">再来一轮 🔄</button>
      ${getWrongCount() > 0 ? `<button class="mode-tab" data-action="switchToWrongReview" style="background:#2a1a1a;border-color:#ff6b6b;color:#ff9d6b;padding:12px 24px;border-radius:10px;cursor:pointer;font-size:14px">
        复习错题 (${getWrongCount()})
      </button>` : ''}
    </div>
  `;
}

function renderWrongReview() {
  const totalWrongs = S.wrongQueue.length + 1;
  const done = S.wrongDoneCount;
  const pct = totalWrongs > 0 ? Math.round((done / totalWrongs) * 100) : 0;
  const [cn, enBrand, groupDisplay, groupInternal, typ] = S.current;
  const displayName = enBrand || cn;
  const qLabel = S.mode === 'group' ? '这个品牌属于哪个集团？' : '这个品牌属于哪个品类？';

  const typePillsHtml = Object.entries(TYPE_MAP).map(([k, v]) =>
    `<span class="type-pill" style="border-color:${TYPE_COLORS[k]};color:${TYPE_COLORS[k]}">${k}·${v}</span>`
  ).join('');

  return `
    <div class="status-bar">
      <span style="color:#ff9d6b">错题复习 ${done} / ${totalWrongs}</span>
      <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%;background:#ff6b6b"></div></div>
      <span style="color:#ff9d6b">剩余 ${S.wrongQueue.length}</span>
    </div>

    <div style="text-align:center;margin-bottom:12px">
      <button class="mode-tab" data-action="exitWrongReview"
        style="background:#2a2a3a;border-color:#ff6b6b;color:#ff9d6b;border-radius:8px;padding:6px 16px;cursor:pointer">
        ← 退出错题复习
      </button>
      <button class="mode-tab" data-action="clearWrongReview"
        style="background:#2a2a3a;border-color:#555;color:#888;border-radius:8px;padding:6px 16px;cursor:pointer;margin-left:8px">
        清空错题
      </button>
    </div>

    <div class="type-legend">${typePillsHtml}</div>

    <div class="card" id="qcard">
      <div class="question-label">错题复习 ${done} / ${totalWrongs}</div>
      <div class="brand-name">${displayName}</div>
      <div class="answer-hint">${qLabel}</div>
      <div class="answer-input-wrap">
        <input type="text" id="answerInput" class="answer-input"
          placeholder="输入答案后按回车或点击提交" autocomplete="off" />
      </div>
      <button class="submit-btn" id="submitBtn" data-action="submitAnswer">提交答案</button>
      <div class="feedback" id="feedback"></div>
    </div>

    <button class="skip-btn" id="skipBtn" data-action="skip">跳过此题（显示答案）→</button>
  `;
}

// ════════════════════════════════════════════════
// 启动
// ════════════════════════════════════════════════
const initPool = getFilteredBrands();
S.queue = shuffle([...initPool]);
S.totalCount = initPool.length;
nextQuestion();
</script>
</body>
</html>
